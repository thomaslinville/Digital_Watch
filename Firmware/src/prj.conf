# Bus + shell tooling for bring-up
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL=y
CONFIG_LOG=y

# Sensors
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_BMI270=y
CONFIG_MAX30101=y   # Zephyr's MAX30101 driver also covers MAX30102 (red + IR only)

CONFIG_MAIN_STACK_SIZE=2048
